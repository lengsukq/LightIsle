name: Release macOS (arm64)

on:
  workflow_dispatch:
    inputs:
      version_prefix:
        description: "Optional version prefix (defaults to vars.LIGHTISLE_VERSION_PREFIX or apps/macos/Info.plist)"
        required: false
        default: ""
      prerelease:
        description: "Mark GitHub Release as prerelease"
        required: false
        type: boolean
        default: false
      release_notes:
        description: "Optional extra notes appended to the generated GitHub Release body"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Sign & Release macOS arm64 DMG
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (web build)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Setup Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod

      - name: Compute timestamped release version
        id: version
        env:
          TZ: ${{ vars.LIGHTISLE_TZ || 'Asia/Shanghai' }}
          INPUT_PREFIX: ${{ inputs.version_prefix }}
          VAR_PREFIX: ${{ vars.LIGHTISLE_VERSION_PREFIX }}
        run: |
          set -euo pipefail
          plist_ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' apps/macos/Info.plist)"
          base="${INPUT_PREFIX:-${VAR_PREFIX:-$plist_ver}}"
          base="${base#v}"
          base="${base%%-*}"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version prefix '$base': expected major.minor.patch." >&2
            exit 1
          fi
          ts_dash="$(date +%Y%m%d-%H%M%S)"
          ts_num="$(date +%Y%m%d%H%M%S)"
          short_version="${base}-${ts_dash}"
          tag_name="v${short_version}"
          {
            echo "base=${base}"
            echo "ts_dash=${ts_dash}"
            echo "build_number=${ts_num}"
            echo "short_version=${short_version}"
            echo "tag_name=${tag_name}"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: ${tag_name} (CFBundleShortVersionString=${short_version}, CFBundleVersion=${ts_num})"

      - name: Import macOS signing certificate into temporary keychain
        id: keychain
        env:
          P12_BASE64: ${{ secrets.LIGHTISLE_SIGN_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.LIGHTISLE_SIGN_P12_PASSWORD }}
          SIGN_IDENTITY: ${{ vars.LIGHTISLE_SIGN_IDENTITY || 'LightIsle Local Dev' }}
        run: |
          set -euo pipefail
          if [[ -z "$P12_BASE64" || -z "$P12_PASSWORD" ]]; then
            echo "Missing LIGHTISLE_SIGN_P12_BASE64 or LIGHTISLE_SIGN_P12_PASSWORD Actions secret." >&2
            exit 1
          fi

          KC_PATH="${RUNNER_TEMP}/build-signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          P12_PATH="${RUNNER_TEMP}/lightisle-sign.p12"
          trap 'rm -f "$P12_PATH"' EXIT

          printf '%s' "$P12_BASE64" | tr -d ' \r\n' | base64 --decode > "$P12_PATH"
          chmod 600 "$P12_PATH"

          prev_keychains="$(security list-keychains -d user | tr -d '"' | xargs)"
          echo "prev_keychains=${prev_keychains}" >> "$GITHUB_OUTPUT"
          echo "kc_path=${KC_PATH}" >> "$GITHUB_OUTPUT"

          security create-keychain -p "$KC_PASS" "$KC_PATH"
          security set-keychain-settings -lut 21600 "$KC_PATH"
          security unlock-keychain -p "$KC_PASS" "$KC_PATH"
          security import "$P12_PATH" -k "$KC_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC_PATH" >/dev/null
          # Keep our temporary keychain ahead of existing user keychains so codesign resolves it automatically.
          # shellcheck disable=SC2086
          security list-keychains -d user -s "$KC_PATH" $prev_keychains
          echo "Imported signing identity candidate: ${SIGN_IDENTITY}"

      - name: Build, verify and package macOS app & DMG
        env:
          LIGHTISLE_CODESIGN_IDENTITY: ${{ vars.LIGHTISLE_SIGN_IDENTITY || 'LightIsle Local Dev' }}
          LIGHTISLE_RELEASE_VERSION: ${{ steps.version.outputs.short_version }}
          LIGHTISLE_BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          bash scripts/build-macos.sh
          codesign --verify --deep --strict dist/LightIsle.app
          codesign -dv --verbose=2 dist/LightIsle.app 2>&1 | grep -E "Authority=|Identifier=|CDHash="
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' dist/LightIsle.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' dist/LightIsle.app/Contents/Info.plist

      - name: Prepare versioned DMG and SHA-256 checksum
        id: dmg
        env:
          SHORT_VERSION: ${{ steps.version.outputs.short_version }}
        run: |
          set -euo pipefail
          DMG_NAME="LightIsle-${SHORT_VERSION}-arm64.dmg"
          SHA_NAME="${DMG_NAME}.sha256"
          mv "dist/LightIsle-dev.dmg" "dist/${DMG_NAME}"
          (cd dist && shasum -a 256 "${DMG_NAME}" > "${SHA_NAME}")
          cat "dist/${SHA_NAME}"
          {
            echo "dmg_name=${DMG_NAME}"
            echo "sha_name=${SHA_NAME}"
            echo "dmg_path=dist/${DMG_NAME}"
            echo "sha_path=dist/${SHA_NAME}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.dmg_name }}
          path: |
            ${{ steps.dmg.outputs.dmg_path }}
            ${{ steps.dmg.outputs.sha_path }}
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.version.outputs.tag_name }}
          SHORT_VERSION: ${{ steps.version.outputs.short_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          SIGN_IDENTITY: ${{ vars.LIGHTISLE_SIGN_IDENTITY || 'LightIsle Local Dev' }}
          DMG_PATH: ${{ steps.dmg.outputs.dmg_path }}
          SHA_PATH: ${{ steps.dmg.outputs.sha_path }}
          PRERELEASE: ${{ inputs.prerelease }}
          EXTRA_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          SHA_VAL="$(awk '{print $1}' "$SHA_PATH")"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          printf '%s\n' \
            "## LightIsle macOS (arm64) ${SHORT_VERSION}" \
            "" \
            "- **Tag**: \`${TAG_NAME}\`" \
            "- **Build Number**: \`${BUILD_NUMBER}\`" \
            "- **Signing Identity**: \`${SIGN_IDENTITY}\` (self-signed permanent local certificate; not Apple notarized)" \
            "- **DMG SHA-256**: \`${SHA_VAL}\`" \
            "- **Commit**: \`${GITHUB_SHA}\`" \
            "" \
            "> Self-signed macOS build: on first launch, right-click **LightIsle.app -> Open** (or approve in **System Settings -> Privacy & Security**)." \
            > "$NOTES_FILE"
          if [[ -n "$EXTRA_NOTES" ]]; then
            printf '\n### Notes\n\n%s\n' "$EXTRA_NOTES" >> "$NOTES_FILE"
          fi

          flags=(--target "${GITHUB_SHA}" --title "LightIsle ${SHORT_VERSION}" --notes-file "$NOTES_FILE")
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$TAG_NAME" "$DMG_PATH" "$SHA_PATH" "${flags[@]}"

      - name: Cleanup temporary keychain
        if: always()
        env:
          KC_PATH: ${{ steps.keychain.outputs.kc_path }}
          PREV_KEYCHAINS: ${{ steps.keychain.outputs.prev_keychains }}
        run: |
          if [[ -n "${PREV_KEYCHAINS:-}" ]]; then
            # shellcheck disable=SC2086
            security list-keychains -d user -s $PREV_KEYCHAINS || true
          fi
          if [[ -n "${KC_PATH:-}" && -f "${KC_PATH}" ]]; then
            security delete-keychain "$KC_PATH" || true
          fi
          rm -f "${RUNNER_TEMP}/lightisle-sign.p12" || true

name: Publish Android + macOS Community Release (manual)

# Explicit human-triggered preview distribution only. macOS is ad-hoc signed
# and NOT notarized. Android uses the long-lived private release keystore.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightisle-community-release
  cancel-in-progress: false

jobs:
  version:
    name: Generate time-based release version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      stamp: ${{ steps.version.outputs.stamp }}
      build_number: ${{ steps.version.outputs.build_number }}
      tag: ${{ steps.version.outputs.tag }}
      base_version: ${{ steps.version.outputs.base_version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: UTC timestamp + monotonic Android/macOS build counter
        shell: bash
        run: |
          set -euo pipefail
          now="$(date -u +%s)"
          stamp="$(date -u +%Y%m%d%H%M%S)"
          # Android versionCode must remain under Google Play's integer limit.
          # Count seconds since 2020-01-01 UTC to retain decades of headroom.
          build_number="$((now - 1577836800))"
          base_version="$(python3 -c 'import re, pathlib; s=pathlib.Path("apps/flutter/pubspec.yaml").read_text(); m=re.search(r"(?m)^version:\s*(\d+\.\d+\.\d+)\+\d+\s*$", s); assert m, "Flutter pubspec.yaml requires major.minor.patch+build"; print(m.group(1))')"
          if (( build_number < 1 || build_number > 2100000000 )); then
            echo "::error::Timestamp build counter out of Android range."
            exit 1
          fi
          {
            echo "stamp=$stamp"
            echo "build_number=$build_number"
            echo "base_version=$base_version"
            echo "tag=v$base_version-beta.$stamp"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag: v$base_version-beta.$stamp"
          echo "Build counter: $build_number"

  android:
    name: Android signed APK + AAB
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: apps/flutter/android/**/*.gradle*
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore long-lived Android signing key (private)
        env:
          KEYSTORE_B64: ${{ secrets.LIGHTISLE_ANDROID_KEYSTORE_BASE64 }}
          LIGHTISLE_ANDROID_STORE_PASSWORD: ${{ secrets.LIGHTISLE_ANDROID_STORE_PASSWORD }}
          LIGHTISLE_ANDROID_KEY_PASSWORD: ${{ secrets.LIGHTISLE_ANDROID_KEY_PASSWORD }}
          LIGHTISLE_ANDROID_KEY_ALIAS: ${{ secrets.LIGHTISLE_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_B64:?Missing LIGHTISLE_ANDROID_KEYSTORE_BASE64 secret}"
          : "${LIGHTISLE_ANDROID_STORE_PASSWORD:?Missing Android store password secret}"
          : "${LIGHTISLE_ANDROID_KEY_PASSWORD:?Missing Android key password secret}"
          : "${LIGHTISLE_ANDROID_KEY_ALIAS:?Missing Android key alias secret}"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/lightisle-android-release.jks"
          echo "LIGHTISLE_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/lightisle-android-release.jks" >> "$GITHUB_ENV"

      - name: Validate Flutter project
        working-directory: apps/flutter
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Build properly signed Release APK and AAB
        working-directory: apps/flutter
        env:
          LIGHTISLE_ANDROID_STORE_PASSWORD: ${{ secrets.LIGHTISLE_ANDROID_STORE_PASSWORD }}
          LIGHTISLE_ANDROID_KEY_PASSWORD: ${{ secrets.LIGHTISLE_ANDROID_KEY_PASSWORD }}
          LIGHTISLE_ANDROID_KEY_ALIAS: ${{ secrets.LIGHTISLE_ANDROID_KEY_ALIAS }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          BASE_VERSION: ${{ needs.version.outputs.base_version }}
        run: |
          set -euo pipefail
          flutter build apk --release --no-pub --build-name="$BASE_VERSION" --build-number="$BUILD_NUMBER"
          # Flutter CLI currently has an AAB post-build symbol-strip false
          # negative on some toolchains despite a successful signed Gradle
          # bundleRelease. Run the supported underlying task explicitly and
          # verify the signed AAB afterwards rather than patching Flutter SDK.
          (cd android && bash gradlew bundleRelease)

      - name: Verify APK signer matches uploaded release keystore
        env:
          LIGHTISLE_ANDROID_STORE_PASSWORD: ${{ secrets.LIGHTISLE_ANDROID_STORE_PASSWORD }}
          LIGHTISLE_ANDROID_KEY_ALIAS: ${{ secrets.LIGHTISLE_ANDROID_KEY_ALIAS }}
        run: python3 scripts/verify-android-signature.py apps/flutter/build/app/outputs/flutter-apk/app-release.apk

      - name: Verify signed Android App Bundle
        env:
          LIGHTISLE_ANDROID_STORE_PASSWORD: ${{ secrets.LIGHTISLE_ANDROID_STORE_PASSWORD }}
          LIGHTISLE_ANDROID_KEY_ALIAS: ${{ secrets.LIGHTISLE_ANDROID_KEY_ALIAS }}
        run: python3 scripts/verify-android-signature.py apps/flutter/build/app/outputs/bundle/release/app-release.aab

      - name: Prepare signed artifacts and checksums
        env:
          STAMP: ${{ needs.version.outputs.stamp }}
          BASE_VERSION: ${{ needs.version.outputs.base_version }}
        run: |
          set -euo pipefail
          mkdir -p dist/release
          cp apps/flutter/build/app/outputs/flutter-apk/app-release.apk "dist/release/LightIsle-Android-$STAMP.apk"
          cp apps/flutter/build/app/outputs/bundle/release/app-release.aab "dist/release/LightIsle-Android-$STAMP.aab"
          cd dist/release
          sha256sum "LightIsle-Android-$STAMP.apk" "LightIsle-Android-$STAMP.aab" > "LightIsle-Android-$STAMP.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lightisle-community-android
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS Apple Silicon ad-hoc DMG
    needs: version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Require Apple Silicon and select Xcode
        run: |
          set -euo pipefail
          if [[ "$(uname -s)" != "Darwin" || "$(uname -m)" != "arm64" ]]; then
            echo "::error::This release requires a native Apple Silicon runner."
            exit 1
          fi
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$newest"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build, test, sign ad-hoc and create DMG
        env:
          LIGHTISLE_BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          LIGHTISLE_RELEASE_VERSION: ${{ needs.version.outputs.base_version }}
        run: bash scripts/build-macos.sh
      - name: Verify ad-hoc signature, version and image
        env:
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          BASE_VERSION: ${{ needs.version.outputs.base_version }}
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          set -euo pipefail
          app=dist/LightIsle.app
          codesign --verify --deep --strict "$app"
          signature="$(codesign -dv --verbose=4 "$app" 2>&1)"
          grep -q 'Signature=adhoc' <<< "$signature"
          actual="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")"
          test "$actual" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$BASE_VERSION"
          hdiutil verify dist/LightIsle-dev.dmg
          mkdir -p dist/release
          cp dist/LightIsle-dev.dmg "dist/release/LightIsle-macOS-arm64-$STAMP-ad-hoc.dmg"
          cd dist/release
          shasum -a 256 "LightIsle-macOS-arm64-$STAMP-ad-hoc.dmg" > "LightIsle-macOS-arm64-$STAMP-ad-hoc.dmg.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lightisle-community-macos
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    name: Publish prerelease to GitHub Releases
    needs: [version, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lightisle-community-*
          path: dist/release
          merge-multiple: true
      - name: Verify both-platform checksums
        working-directory: dist/release
        env:
          STAMP: ${{ needs.version.outputs.stamp }}
        run: |
          set -euo pipefail
          sha256sum --check "LightIsle-Android-$STAMP.sha256"
          sha256sum --check "LightIsle-macOS-arm64-$STAMP-ad-hoc.dmg.sha256"
      - name: Publish all assets in one GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          STAMP: ${{ needs.version.outputs.stamp }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          ## LightIsle Community Preview

          - UTC release timestamp: $STAMP
          - Android and macOS build counter: $BUILD_NUMBER
          - Android: signed APK for direct installation, signed AAB for possible Play distribution.
          - macOS: Apple Silicon-only DMG, **ad-hoc signed and NOT notarized**.
          - First macOS launch may require manual authorization in System Settings → Privacy & Security.
          - **Pre-release:** external drives, backup/recovery and mobile background behavior have not all passed real-device acceptance. Back up important files independently.
          - Download the matching `.sha256` file to verify assets.
          EOF
          gh release create "$TAG" dist/release/* \
            --title "LightIsle Community $STAMP" \
            --target "$GITHUB_SHA" \
            --notes-file release-notes.md \
            --prerelease
          echo "Created Community pre-release $TAG"
